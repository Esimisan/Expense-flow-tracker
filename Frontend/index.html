<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="shortcut icon"
      type="image/jpg"
      href="images/expenseflow_favicon2.jpg"
    />
    <title>ExpenseFlow – Sign Up</title>
    <script>
      // If already logged in with a valid token, skip straight to dashboard.
      // (Backstop only — index.js's redirectIfLoggedIn() does the real check
      // against token expiry; this is just a blocking pre-check to avoid a
      // flash of the register form before that runs.)
      if (
        localStorage.getItem("expenseflow_user") &&
        localStorage.getItem("expenseflow_token")
      ) {
        window.location.replace("dashboard.html");
      }
    </script>
  </head>

  <body class="register-body">
    <div class="register-page">
      <!-- Logo / App name -->
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="brand-name">ExpenseFlow</h1>
        <p class="brand-tagline">Track every naira, every day.</p>
      </div>

      <!-- Registration card -->
      <div class="register-card">
        <h2>Create your account</h2>
        <p class="register-sub">Enter your details to get started</p>

        <div class="input-group">
          <label for="name">Full Name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input
              id="name"
              type="text"
              placeholder="e.g. Osariemen Obamogie"
              autocomplete="name"
            />
          </div>
          <span class="field-error hidden" id="err-name"
            >Please enter your name.</span
          >
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <span class="field-error hidden" id="err-email"
            >Please enter a valid email address.</span
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              id="password"
              type="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
            />
          </div>
          <span class="field-error hidden" id="err-password"
            >Password must be at least 6 characters.</span
          >
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              id="confirm-password"
              type="password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
            />
          </div>
          <span class="field-error hidden" id="err-confirm-password"
            >Passwords do not match.</span
          >
        </div>

        <span class="field-error hidden" id="err-form"></span>

        <button type="button" class="submit-btn" id="register-btn">
          Get Started <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
