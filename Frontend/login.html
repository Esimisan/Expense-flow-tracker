<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>ExpenseFlow – Sign In</title>
    <script>
      if (
        localStorage.getItem("expenseflow_user") &&
        localStorage.getItem("expenseflow_token")
      ) {
        window.location.replace("dashboard.html");
      }
    </script>
  </head>

  <body class="register-body">
    <div class="register-page">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="brand-name">ExpenseFlow</h1>
        <p class="brand-tagline">Track every naira, every day.</p>
      </div>

      <div class="register-card">
        <h2>Welcome back</h2>
        <p class="register-sub">Sign in to your account</p>

        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <span class="field-error hidden" id="err-email"
            >Please enter a valid email address.</span
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              id="password"
              type="password"
              placeholder="Your password"
              autocomplete="current-password"
            />
          </div>
          <span class="field-error hidden" id="err-password"
            >Please enter your password.</span
          >
        </div>

        <span class="field-error hidden" id="err-form"></span>

        <button type="button" class="submit-btn" id="login-btn">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="auth-switch">
          Don't have an account? <a href="index.html">Sign up</a>
        </p>
      </div>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
